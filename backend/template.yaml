AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Resources:
  # 1. 람다 함수 설정
  RecommendApiFunction: # 함수 이름 (원하는 대로 수정 가능)
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: lambda_function.lambda_handler
      Runtime: python3.9
      Policies:
        - DynamoDBCrudPolicy:
            TableName: inhatc-team2-1-recommend-cache
        - DynamoDBCrudPolicy:
            TableName: inhatc-team2-5-air-cache
        - S3ReadPolicy:
            BucketName: inhatc-team2-5-raw-data
      Environment:
        Variables:
          TABLE_NAME: inhatc-team2-1-recommend-cache
          AIR_TABLE_NAME: inhatc-team2-5-air-cache
