AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: "Common S3 & DynamoDB Stack"
Resources:
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: inhatc-team2-3-frontend
  RawDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: inhatc-team2-5-raw-data
  ParquetDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: inhatc-team2-4-parquet-data

  WeatherCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: inhatc-team2-5-weather-cache
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: region_code, AttributeType: S}]
      KeySchema: [{AttributeName: region_code, KeyType: HASH}]
  AirCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: inhatc-team2-5-air-cache
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: region_code, AttributeType: S}]
      KeySchema: [{AttributeName: region_code, KeyType: HASH}]
  RecommendCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: inhatc-team2-1-recommend-cache
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: PK, AttributeType: S}
        - {AttributeName: SK, AttributeType: S}
      KeySchema:
        - {AttributeName: PK, KeyType: HASH}
        - {AttributeName: SK, KeyType: RANGE}