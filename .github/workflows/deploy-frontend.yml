name: Deploy Frontend (Vue.js)

on:
  push:
    branches: [main, develop]
    paths: ["frontend/**"]
  workflow_dispatch:
    inputs:
      confirm:
        description: "수동 배포를 진행하려면 yes를 입력하세요"
        required: true
        type: string
        default: "no"

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    if: github.event_name == 'push' || inputs.confirm == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::269578498605:role/service-role/github-actions-inhatc-shared
          aws-region: us-east-1
      - name: Install & Build
        env:
          VUE_APP_KAKAO_API_KEY: ${{ secrets.KAKAO_API_KEY }}
        run: |
          cd frontend
          npm install
          npm run build
      - name: S3 Sync
        run: |
          aws s3 sync frontend/dist/ s3://inhatc-team2-3-frontend --delete
