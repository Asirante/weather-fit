name: Deploy Frontend (Vue.js)

on:
  push:
    branches: [main, develop]
    paths: ["frontend/**"]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::269578498605:role/service-role/github-actions-inhatc-shared
          aws-region: us-east-1
      - name: Install & Build
        run: |
          cd frontend
          npm install
          npm run build
      - name: S3 Sync
        run: |
          aws s3 sync frontend/dist/ s3://inhatc-team2-3-frontend --delete
