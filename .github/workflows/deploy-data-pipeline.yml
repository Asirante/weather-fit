name: Deploy Data Code

on:
  push:
    branches: [main]
    paths: ["data_pipeline/**"]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::269578498605:role/service-role/github-actions-inhatc-shared
          aws-region: us-east-1
      - name: Zip and Update Code
        run: |
          cd data_pipeline
          zip -r ../deploy.zip .
          aws lambda update-function-code \
            --function-name inhatc-team2-5-dataAPI \
            --zip-file fileb://../deploy.zip