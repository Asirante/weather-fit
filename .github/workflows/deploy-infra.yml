name: Deploy Infrastructure (S3 & DynamoDB)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "인프라를 정말로 배포하시겠습니까? (yes 입력)"
        required: true
        default: "no"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'yes'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AWS SAM CLI
        run: |
          pip install aws-sam-cli

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::269578498605:role/service-role/github-actions-inhatc-shared
          aws-region: us-east-1

      - name: SAM Build and Deploy
        run: |
          cd infra
          sam build
          # --s3-bucket 옵션을 통해 SAM이 관리용 스택(managed-default)을 새로 생성하지 않도록 방지합니다.
          # 기존에 생성할 Raw Data 버킷을 임시 저장소로 활용합니다.
          sam deploy \
            --stack-name inhatc-team2-infra \
            --region us-east-1 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --capabilities CAPABILITY_IAM \
            --s3-bucket inhatc-team2-5-raw-data
