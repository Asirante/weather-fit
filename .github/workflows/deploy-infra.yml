name: Deploy Infrastructure (Common S3/DB)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'yes 입력 시 배포 시작'
        required: true
        default: 'no'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'yes'
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::269578498605:role/service-role/github-actions-inhatc-shared
          aws-region: us-east-1
      - name: SAM Build and Deploy
        run: |
          cd infra
          sam build
          sam deploy \
            --stack-name inhatc-team2-infra \
            --region us-east-1 \
            --no-confirm-changeset \
            --capabilities CAPABILITY_IAM \
            --s3-bucket inhatc-team2-5-raw-data