name: Deploy Real-time Pipeline (Member 5 Stack)

on:
  push:
    branches: [main]
    paths: ["real_time/**"]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::269578498605:role/service-role/github-actions-inhatc-shared
          aws-region: us-east-1
      - name: SAM Build and Deploy
        run: |
          cd real_time
          sam build
          sam deploy \
            --stack-name inhatc-team2-5-real-time \
            --region us-east-1 \
            --no-confirm-changeset \
            --capabilities CAPABILITY_IAM \
            --s3-bucket inhatc-team2-5-raw-data \
            --parameter-overrides \
                WeatherApiKey=${{ secrets.WEATHER_API_KEY }} \
                AirApiKey=${{ secrets.AIR_API_KEY }}